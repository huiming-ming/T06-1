
<!DOCTYPE html>
<html lang="en">

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Responsive D3 Chart</title>

    <!-- CSS files -->

                    Downloaded Jan 2025

    <footer>
        <p>&copy; 2025 Data Visualisation Week 6</p>
    </footer>

    <!-- D3.js library -->

    <!-- JavaScript files -->
    <script src="js/load-data.js"></script>
